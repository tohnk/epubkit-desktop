[package]
name = "epubkit-desktop"
description = "Desktop front-end for epubkit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "epubkit_desktop"
path = "src/lib.rs"

[[bin]]
name = "epubkit-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
epubkit-core.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile.workspace = true

[dev-dependencies]
serde_json = "1"
tempfile.workspace = true
zip.workspace = true
