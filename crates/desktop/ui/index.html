<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>epubkit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <span class="logo-icon">📖</span>
                <h1>epubkit</h1>
            </div>
            <p class="subtitle">Optimize any EPUB for Xteink e-ink readers</p>
        </header>

        <!-- Drop zone -->
        <div id="drop-zone" class="upload-zone">
            <div class="upload-content">
                <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                <p class="upload-label">Drop EPUB files here</p>
                <p class="upload-hint">or click to browse</p>
            </div>
        </div>

        <div id="file-list" class="file-list" hidden></div>

        <!-- Options -->
        <div id="options-panel" class="options-panel" hidden>
            <div class="section-header"><h2>Options</h2></div>

            <div class="device-bar">
                <span class="device-label">Device</span>
                <div class="device-toggle" id="device-toggle"></div>
            </div>

            <div class="preset-bar" id="preset-bar"></div>

            <div class="options-grid">
                <label class="option">
                    <input type="checkbox" data-option="grayscale">
                    <div class="option-text"><span>Grayscale</span><small>Convert images for e-ink display</small></div>
                </label>
                <label class="option">
                    <input type="checkbox" data-option="contrast_boost">
                    <div class="option-text"><span>Contrast Boost</span><small>Improve readability on e-ink</small></div>
                </label>
                <label class="option">
                    <input type="checkbox" data-option="remove_fonts">
                    <div class="option-text"><span>Remove Fonts</span><small>Strip embedded fonts</small></div>
                </label>
                <label class="option">
                    <input type="checkbox" data-option="remove_unused_css">
                    <div class="option-text"><span>Clean CSS</span><small>Remove unused stylesheets</small></div>
                </label>
                <label class="option">
                    <input type="checkbox" data-option="clean_metadata">
                    <div class="option-text"><span>Clean Metadata</span><small>Strip store/calibre tags</small></div>
                </label>
                <label class="option">
                    <input type="checkbox" data-option="text_cleanup">
                    <div class="option-text"><span>Text Cleanup</span><small>Fix spacing, OCR errors, encoding</small></div>
                </label>
                <label class="option option-wide">
                    <input type="checkbox" data-option="light_novel_mode">
                    <div class="option-text"><span>Light Novel Mode</span><small>Rotate &amp; split landscape images for vertical reading</small></div>
                </label>
            </div>

            <div class="quality-control">
                <label class="quality-label">JPEG Quality</label>
                <div class="quality-presets">
                    <button class="quality-btn" data-quality="40">Low</button>
                    <button class="quality-btn" data-quality="60">Med</button>
                    <button class="quality-btn" data-quality="70">High</button>
                    <button class="quality-btn" data-quality="85">Max</button>
                </div>
                <div class="quality-slider-row">
                    <input type="range" id="quality" min="20" max="95" value="70">
                    <span id="quality-value">70%</span>
                </div>
            </div>

            <div class="preset-actions">
                <button id="save-preset-btn" class="ghost-btn">Save these as a preset…</button>
                <button id="delete-preset-btn" class="ghost-btn danger" hidden>Delete this preset</button>
            </div>

            <div id="preset-namer" class="preset-namer" hidden>
                <input type="text" id="preset-name" placeholder="Name this preset" maxlength="40">
                <button id="preset-confirm" class="ghost-btn">Save</button>
                <button id="preset-cancel" class="ghost-btn">Cancel</button>
            </div>

            <button id="optimize-btn" class="process-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                    <polyline points="16 16 12 12 8 16"/>
                    <line x1="12" y1="12" x2="12" y2="21"/>
                    <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
                </svg>
                Optimize
            </button>
        </div>

        <div id="progress-section" class="progress-section" hidden>
            <div class="section-header"><h2>Processing</h2></div>
            <div id="progress-items"></div>
        </div>

        <div id="results-section" class="results-section" hidden>
            <div class="section-header"><h2>Results</h2></div>
            <div id="results-items"></div>
            <button id="clear-btn" class="ghost-btn">Start again</button>
        </div>

        <footer>
            <p id="status-line"></p>
        </footer>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
