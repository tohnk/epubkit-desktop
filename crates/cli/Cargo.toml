[package]
name = "epubkit-cli"
description = "Command-line front-end for epubkit-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "epubkit"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
epubkit-core.workspace = true
tempfile.workspace = true

[dev-dependencies]
epubkit-core.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png"] }
jpeg-encoder = "0.7.1"
zip.workspace = true
