[package]
name = "epubkit-core"
description = "EPUB optimization pipeline for e-ink readers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
encoding_rs = "0.8.42"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
jpeg-encoder = "0.7.1"
libxml.workspace = true
# Only the parser and printer are used. The default features add a bundler and
# source maps, and with them rkyv (RUSTSEC-2026-0235).
lightningcss = { version = "1.0.0-alpha.72", default-features = false }
percent-encoding.workspace = true
tempfile.workspace = true
regex.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
walkdir.workspace = true
zip.workspace = true
serde.workspace = true
toml = "1.1.4"
dirs = "6.0.0"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
tempfile.workspace = true
toml = "1.1.4"
