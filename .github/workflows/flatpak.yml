name: Flatpak

# A build takes a while, so this runs on pushes only. A pull request from a
# branch here still shows its result, as a check on the branch's commit.
on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak:
    name: flatpak (x86_64)
    runs-on: ubuntu-latest
    container:
      # Flathub's builder image, holding the GNOME 51 SDK the manifest builds
      # on. Privileged, because flatpak-builder sandboxes each build step.
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v5

      # Builds the app, runs the manifest's tests inside the runtime, and
      # uploads epubkit.flatpak as an artifact of the run.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/io.github.tohnk.epubkit.yml
          bundle: epubkit.flatpak
          run-tests: true
          cache-key: flatpak-builder-${{ github.sha }}
