name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The two link different libxml2 releases: Ubuntu's distro copy, and
        # Homebrew's current one on macOS. They disagree about how to decode a
        # malformed chapter, so the suite has to pass against both. macOS also
        # brings a case-insensitive filesystem.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
          echo "libxml2 $(pkg-config --modversion libxml-2.0)"

      - name: Install system libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libxml2 pkgconf
          brew list --versions libxml2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked
