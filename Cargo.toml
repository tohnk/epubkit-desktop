[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/tohnk/epubkit-desktop"

[workspace.dependencies]
epubkit-core = { path = "crates/core" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
libxml = "0.3"
percent-encoding = "2.3"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
tempfile = "3"
thiserror = "2.0"
unicode-normalization = "0.1"
walkdir = "2.5"
zip = { version = "8", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
